name: CI for Sonar and Docker

on:
 workflow_dispatch

env:
 DOCKER_IMAGE: rudreshayd/darshimage
 DOCKER_USERNAME: ${{vars.DOCKER_NAME}}
 DOCKER_PASSWORD: ${{secrets.DOCKERPASSWORD}}

jobs:
  code-checkout:
   runs-on: ubuntu-latest
   steps:
     - name: checkout
       uses: actions/checkout@v5.0.0
  #sonarcloud:
     #  needs: code-checkout
      #steps:
       #  - name: Analyze with SonarCloud
        #   uses: codebeltnet/sonarcloud-scan@e96192d754f4e900db9414660d519c2ecb51777e
         #  with: 
          #  projectkey: Api-Flask
           # SONARCLOUDSECRETS: ${{secrets.SONARCLOUDSECRETS}}

  #build:
    #needs: [code-checkout]
    #runs-on: ubuntu-latest
 
     - name: Docker Login
       uses: docker/login-action@v3.6.0
       with:
           username: ${{env. DOCKER_USERNAME}}
           password: ${{env.DOCKER_PASSWORD}}
     - name: Build  images  
       run: |
          docker build -t ${{env.DOCKER_IMAGE}}:${{github.sha}} .
          docker tag $DOCKER_IMAGE:${{github.sha}} $DOCKER_IMAGE:latest
     - name: Push Images
       run: |
          docker push $DOCKER_IMAGE:${{github.sha}}
          docker push $DOCKER_IMAGE:latest
     - name: Docker container
       run: |
          docker run -d $DOCKER_IMAGE:${{github.sha}} -p 5000:5000 $DOCKER_IMAGE:latest
